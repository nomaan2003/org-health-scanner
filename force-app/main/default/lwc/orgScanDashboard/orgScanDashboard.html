<template>
    <lightning-card title="Org Health Scan Results" icon-name="standard:health_cloud">
        <template if:true={scan}>
            <div class="slds-p-around_medium">
                <div class="slds-grid slds-gutters slds-m-bottom_medium">
                    <div class="slds-col slds-size_1-of-3">
                        <div class="slds-text-heading_small">Health Score</div>
                        <div class="slds-text-heading_large" style={scoreStyle}>
                            {scan.Health_Score__c}
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-3">
                        <div class="slds-text-heading_small">Total Findings</div>
                        <div class="slds-text-heading_large">
                            {scan.Total_Findings__c}
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-3">
                        <div class="slds-text-heading_small">Scan Date</div>
                        <div class="slds-text-heading_medium">
                            <lightning-formatted-date-time value={scan.Scan_Date__c}></lightning-formatted-date-time>
                        </div>
                    </div>
                </div>

                <lightning-combobox
                    label="Filter by Severity"
                    value={severityFilter}
                    options={severityOptions}
                    onchange={handleSeverityChange}
                    class="slds-m-bottom_medium">
                </lightning-combobox>

                <lightning-datatable
                    key-field="Id"
                    data={filteredFindings}
                    columns={columns}
                    hide-checkbox-column="true">
                </lightning-datatable>
            </div>
        </template>

        <template if:false={scan}>
            <div class="slds-p-around_medium">
                No completed scan found. Run OrgScanOrchestrator.runScan() to generate results.
            </div>
        </template>
    </lightning-card>
</template>
